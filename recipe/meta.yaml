{% set name = "gcovr" %}
{% set version = "8.7" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/gcovr-{{ version }}.tar.gz
  sha256: cfb9b2c373cc5be4b1cbe53250a5e4446fe6d4723c6900d3f41aa83540c8ddc8

build:
  noarch: python
  entry_points:
    - gcovr = gcovr.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling ==1.27.0
    - hatch-vcs ==0.5.0
    - hatch-fancy-pypi-readme ==25.1.0
    - pip
  run:
    - python >={{ python_min }}
    - jinja2
    - lxml
    - colorlog
    - pygments >=2.13.0
    # require tomli and typing_extensions for all python
    # versions to keep it noarch
    # can be removed once 3.11 is the minimum version
    - tomli >=1.1.0
    - typing_extensions

test:
  requires:
    - python {{ python_min }}
  imports:
    - gcovr
  commands:
    - pip check
    - gcovr --help
  requires:
    - pip

about:
  home: http://gcovr.com
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: generate GCC code coverage reports
  description: |
    Gcovr provides a utility for managing the use of the GNU gcov utility and
    generating summarized code coverage results. This command is inspired by the
    Python coverage.py package, which provides a similar utility for Python.
  doc_url: http://gcovr.com/guide.html
  dev_url: https://github.com/gcovr/gcovr

extra:
  recipe-maintainers:
    - t-b
    - jdmarques
    - tovrstra
    - mjscosta
